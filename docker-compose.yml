services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    volumes:
      - temporal_pg:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      - postgres
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  api:
    build: .
    profiles: ["app"]
    depends_on:
      - qdrant
      - temporal
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - TEMPORAL_HOST=temporal:7233
      - USE_TEMPORAL_INGESTION=true
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

  worker:
    build: .
    profiles: ["app"]
    depends_on:
      - qdrant
      - temporal
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - TEMPORAL_HOST=temporal:7233
    command: ["python", "-m", "app.temporal.worker"]
    volumes:
      - ./uploads:/app/uploads

volumes:
  qdrant_data:
  temporal_pg: